name: CrispVoice
options:
  bundleIdPrefix: com.crispvoice
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.0"
targets:
  CrispVoice:
    type: application
    platform: macOS
    sources:
      - path: Sources/CrispVoice
    info:
      path: Sources/CrispVoice/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: CrispVoice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: "CrispVoice records your voice locally to transcribe it on your Mac. Audio never leaves your device."
        NSSpeechRecognitionUsageDescription: "CrispVoice uses Apple Speech Recognition to show a live transcript while you dictate."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispvoice.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/CrispVoice/App/CrispVoice.entitlements
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: HotKey
  CrispVoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CrispVoiceTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CrispVoice
schemes:
  CrispVoice:
    build:
      targets:
        CrispVoice: all
        CrispVoiceTests: [test]
    test:
      targets:
        - CrispVoiceTests
